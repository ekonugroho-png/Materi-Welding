<style>
/* ============================================================
   WELDING LEARNING SYSTEM — Cyber Blue Industrial Theme
   ============================================================ */
:root{
  --navy-900:#071324;
  --navy-800:#0B1E35;
  --navy-700:#0f2742;
  --navy-600:#143052;
  --navy-500:#1c3a5e;
  --electric:#2563EB;
  --cyan:#06B6D4;
  --neon:#22D3EE;
  --steel:#94A3B8;
  --white:#F8FAFC;
  --orange:#F97316;
  --red:#EF4444;
  --amber:#F59E0B;
  --green:#10B981;

  --bg:var(--navy-900);
  --bg-2:var(--navy-800);
  --bg-3:var(--navy-700);
  --panel:rgba(15,39,66,0.72);
  --panel-solid:#0f2742;
  --panel-border:rgba(34,211,238,0.18);
  --panel-glow:rgba(37,99,235,0.25);
  --text:#E2E8F0;
  --text-dim:#94A3B8;
  --text-soft:#CBD5E1;
  --heading:#F8FAFC;
  --accent:var(--electric);
  --accent-2:var(--cyan);
  --accent-glow:rgba(34,211,238,0.45);
  --shadow:0 10px 30px -10px rgba(0,0,0,0.6);
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --header-h:62px;
  --sidebar-w:268px;
  --sidebar-w-collapsed:72px;
  --grid-line:rgba(34,211,238,0.04);
}
[data-theme="light"]{
  --bg:#Eef4fb;
  --bg-2:#e3edf8;
  --bg-3:#d8e6f4;
  --panel:rgba(255,255,255,0.82);
  --panel-solid:#ffffff;
  --panel-border:rgba(37,99,235,0.18);
  --panel-glow:rgba(37,99,235,0.12);
  --text:#0f2742;
  --text-dim:#475569;
  --text-soft:#334155;
  --heading:#071324;
  --accent:var(--electric);
  --accent-2:var(--cyan);
  --accent-glow:rgba(37,99,235,0.25);
  --shadow:0 10px 30px -12px rgba(7,19,36,0.18);
  --grid-line:rgba(37,99,235,0.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14.5px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .3s ease;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4,h5{font-family:'Inter',sans-serif;color:var(--heading);font-weight:700;letter-spacing:-0.01em}
.mono{font-family:'JetBrains Mono',monospace}
.tech-title{font-family:'Orbitron',sans-serif;letter-spacing:0.04em}
::selection{background:rgba(34,211,238,0.3);color:#fff}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(34,211,238,0.25);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(34,211,238,0.45)}

/* Industrial grid background */
.app-shell{
  position:relative;
  height:100dvh;width:100vw;
  display:grid;
  grid-template-rows:var(--header-h) 1fr;
  grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-areas:"header header" "sidebar main";
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(37,99,235,0.12), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(6,182,212,0.10), transparent 60%),
    linear-gradient(180deg,var(--bg) 0%, var(--bg-2) 100%);
  overflow:hidden;
}
.app-shell::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 90%);
  z-index:0;
}
.app-shell.sidebar-collapsed{grid-template-columns:var(--sidebar-w-collapsed) 1fr}

/* ===================== HEADER ===================== */
.app-header{
  grid-area:header;
  position:relative;z-index:50;
  display:flex;align-items:center;gap:14px;
  padding:0 16px;
  background:linear-gradient(180deg,rgba(11,30,53,0.95),rgba(11,30,53,0.82));
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--panel-border);
  box-shadow:0 2px 18px rgba(7,19,36,0.4);
}
[data-theme="light"] .app-header{
  background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(255,255,255,0.85));
}
.header-logo{
  display:flex;align-items:center;gap:10px;
  padding:6px 10px;border-radius:12px;
  background:linear-gradient(135deg,rgba(37,99,235,0.15),rgba(6,182,212,0.10));
  border:1px solid var(--panel-border);
}
.logo-mark{
  width:38px;height:38px;border-radius:9px;
  background:
    radial-gradient(circle at 35% 30%,#22D3EE 0%,#2563EB 45%,#071324 100%);
  display:grid;place-items:center;
  box-shadow:0 0 18px rgba(34,211,238,0.4),inset 0 0 8px rgba(255,255,255,0.15);
  position:relative;overflow:hidden;
}
.logo-mark::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,0.25) 50%,transparent 60%);
  animation:shimmer 4s linear infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.logo-mark svg{width:22px;height:22px;color:#fff;position:relative;z-index:2}
.header-titles{display:flex;flex-direction:column;line-height:1.1}
.header-titles .t1{
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:14px;
  color:var(--neon);letter-spacing:0.08em;
}
.header-titles .t2{font-size:11px;color:var(--text-dim);font-weight:500}
.header-sep{width:1px;height:34px;background:var(--panel-border)}
.header-section{display:flex;align-items:center;gap:6px}
.header-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:999px;
  background:rgba(34,211,238,0.10);border:1px solid rgba(34,211,238,0.25);
  font-size:11px;color:var(--neon);font-weight:600;letter-spacing:0.03em;
}
.header-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.header-spacer{flex:1}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;color:var(--text-dim);
  background:rgba(255,255,255,0.04);border:1px solid var(--panel-border);
  transition:all .2s ease;
}
.icon-btn:hover{color:var(--neon);border-color:var(--neon);background:rgba(34,211,238,0.08);transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px}
[data-theme="light"] .icon-btn{background:rgba(7,19,36,0.03)}

.material-select{
  position:relative;
}
.material-select select{
  appearance:none;background:rgba(37,99,235,0.10);
  border:1px solid var(--panel-border);
  color:var(--text);font-size:12.5px;font-weight:600;
  padding:9px 36px 9px 14px;border-radius:10px;cursor:pointer;
  font-family:'Inter';
  max-width:240px;
}
.material-select::after{
  content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;
  border-right:2px solid var(--neon);border-bottom:2px solid var(--neon);
  transform:translateY(-75%) rotate(45deg);pointer-events:none;
}

/* ===================== SIDEBAR ===================== */
.app-sidebar{
  grid-area:sidebar;
  position:relative;z-index:40;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(11,30,53,0.85),rgba(7,19,36,0.85));
  backdrop-filter:blur(14px);
  border-right:1px solid var(--panel-border);
  transition:width .3s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
[data-theme="light"] .app-sidebar{background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(238,244,251,0.9))}
.sidebar-collapsed .app-sidebar{width:var(--sidebar-w-collapsed)}
.sidebar-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid var(--panel-border);
}
.sidebar-head .label{
  font-size:10.5px;font-weight:700;letter-spacing:0.14em;
  color:var(--text-dim);text-transform:uppercase;
}
.sidebar-collapsed .sidebar-head .label,
.sidebar-collapsed .nav-item .nav-label,
.sidebar-collapsed .nav-section-title,
.sidebar-collapsed .sidebar-foot{display:none}
.sidebar-collapsed .sidebar-head{justify-content:center}
.collapse-btn{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  color:var(--text-dim);background:rgba(255,255,255,0.04);
  border:1px solid var(--panel-border);transition:all .2s;
}
.collapse-btn:hover{color:var(--neon)}
.sidebar-collapsed .collapse-btn svg{transform:rotate(180deg)}

.nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 14px}
.nav-section-title{
  font-size:10px;font-weight:700;letter-spacing:0.14em;
  color:var(--text-dim);text-transform:uppercase;
  padding:14px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;margin:2px 0;border-radius:10px;
  color:var(--text-soft);font-size:13px;font-weight:500;
  cursor:pointer;position:relative;transition:all .18s ease;
  white-space:nowrap;
}
.nav-item .nav-icon{
  width:32px;height:32px;flex:0 0 32px;
  border-radius:9px;display:grid;place-items:center;
  background:rgba(255,255,255,0.04);border:1px solid var(--panel-border);
  color:var(--text-dim);transition:all .2s;
}
.nav-item .nav-icon svg{width:17px;height:17px}
.nav-item .nav-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-item .nav-num{
  font-family:'JetBrains Mono';font-size:10px;color:var(--text-dim);
  background:rgba(255,255,255,0.04);padding:2px 6px;border-radius:5px;
}
.nav-item:hover{background:rgba(37,99,235,0.08);color:var(--heading)}
.nav-item:hover .nav-icon{color:var(--neon);border-color:rgba(34,211,238,0.3)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(37,99,235,0.22),rgba(6,182,212,0.10));
  color:var(--heading);
  border:1px solid rgba(34,211,238,0.35);
  box-shadow:0 4px 16px -6px rgba(34,211,238,0.4),inset 0 1px 0 rgba(255,255,255,0.05);
}
.nav-item.active .nav-icon{
  background:linear-gradient(135deg,var(--electric),var(--cyan));
  color:#fff;border-color:transparent;
  box-shadow:0 0 14px rgba(34,211,238,0.5);
}
.nav-item.active .nav-num{background:rgba(34,211,238,0.18);color:var(--neon)}
.nav-item.active::before{
  content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:4px;height:60%;border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--neon),var(--electric));
  box-shadow:0 0 12px var(--neon);
}
.sidebar-collapsed .nav-item{justify-content:center;padding:9px}
.sidebar-collapsed .nav-item .nav-icon{margin:0}

.sidebar-foot{
  padding:10px 14px;border-top:1px solid var(--panel-border);
  font-size:10.5px;color:var(--text-dim);
}
.sidebar-foot strong{color:var(--neon)}

/* ===================== MAIN PANEL ===================== */
.app-main{
  grid-area:main;position:relative;z-index:10;
  display:flex;flex-direction:column;
  overflow:hidden;
}
.main-breadcrumb{
  display:flex;align-items:center;gap:8px;
  padding:8px 18px;font-size:11.5px;color:var(--text-dim);
  background:rgba(7,19,36,0.4);border-bottom:1px solid var(--panel-border);
  flex:0 0 auto;
}
[data-theme="light"] .main-breadcrumb{background:rgba(255,255,255,0.5)}
.main-breadcrumb .crumb-sep{color:var(--text-dim);opacity:.6}
.main-breadcrumb .crumb-active{color:var(--neon);font-weight:600}
.main-content{
  flex:1;position:relative;overflow:hidden;
  padding:14px 18px 10px;
}
.panel-stage{
  position:absolute;inset:14px 18px 10px;
  display:flex;flex-direction:column;
  animation:stageIn .35s cubic-bezier(.2,.7,.3,1);
}
@keyframes stageIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.panel-stage.exit{animation:stageOut .18s forwards}
@keyframes stageOut{to{opacity:0;transform:translateY(-6px)}}

.panel-header{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  margin-bottom:12px;flex:0 0 auto;
}
.panel-title-wrap{display:flex;flex-direction:column;gap:4px}
.panel-eyebrow{
  font-family:'JetBrains Mono';font-size:10.5px;font-weight:600;
  letter-spacing:0.12em;color:var(--cyan);text-transform:uppercase;
}
.panel-title{
  font-size:22px;font-weight:800;color:var(--heading);
  display:flex;align-items:center;gap:10px;
}
.panel-title .panel-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,rgba(37,99,235,0.20),rgba(6,182,212,0.12));
  border:1px solid var(--panel-border);display:grid;place-items:center;
  color:var(--neon);
}
.panel-title .panel-icon svg{width:19px;height:19px}
.panel-subtitle{font-size:12.5px;color:var(--text-dim);max-width:680px;line-height:1.5}

.panel-tools{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.tool-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:9px;font-size:12px;font-weight:600;
  color:var(--text-soft);background:rgba(255,255,255,0.04);
  border:1px solid var(--panel-border);transition:all .18s;
}
.tool-btn:hover{color:var(--neon);border-color:rgba(34,211,238,0.4);background:rgba(34,211,238,0.06)}
.tool-btn svg{width:14px;height:14px}
.tool-btn.primary{
  background:linear-gradient(135deg,var(--electric),var(--cyan));
  color:#fff;border-color:transparent;box-shadow:0 4px 14px -4px rgba(34,211,238,0.5);
}
.tool-btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px -4px rgba(34,211,238,0.6)}

.panel-body{
  flex:1;overflow:hidden;display:flex;flex-direction:column;
  min-height:0;
}

/* Subpage navigation */
.subnav{
  display:flex;gap:6px;flex:0 0 auto;margin-bottom:10px;
  padding:6px;background:rgba(7,19,36,0.5);border:1px solid var(--panel-border);border-radius:12px;
  overflow-x:auto;
}
[data-theme="light"] .subnav{background:rgba(255,255,255,0.6)}
.subnav-item{
  padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;
  color:var(--text-dim);white-space:nowrap;transition:all .15s;
}
.subnav-item:hover{color:var(--text);background:rgba(255,255,255,0.05)}
.subnav-item.active{
  background:linear-gradient(135deg,rgba(37,99,235,0.3),rgba(6,182,212,0.15));
  color:var(--neon);box-shadow:inset 0 0 0 1px rgba(34,211,238,0.3);
}

/* Cards & Glass */
.glass{
  background:var(--panel);
  backdrop-filter:blur(12px);
  border:1px solid var(--panel-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  position:relative;
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,0.05),transparent 50%);
}

.content-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding-right:4px;
}

/* Two column layout */
.two-col{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0;
}
.two-col .col-left,.two-col .col-right{display:flex;flex-direction:column;min-height:0}
.two-col .col-left{flex:1.05}
.two-col .col-right{flex:1}
@media(max-width:1080px){
  .two-col{grid-template-columns:1fr}
}

.illustration-box{
  background:
    radial-gradient(circle at 30% 20%,rgba(34,211,238,0.10),transparent 60%),
    linear-gradient(180deg,rgba(7,19,36,0.6),rgba(11,30,53,0.6));
  border:1px solid var(--panel-border);border-radius:var(--radius);
  position:relative;overflow:hidden;
  display:grid;place-items:center;
  min-height:280px;flex:1;
}
[data-theme="light"] .illustration-box{
  background:linear-gradient(180deg,#f8fbff,#eaf2fb);
}
.illustration-box .ill-label{
  position:absolute;top:10px;left:12px;
  font-family:'JetBrains Mono';font-size:10px;font-weight:600;
  color:var(--cyan);letter-spacing:0.1em;text-transform:uppercase;
  background:rgba(7,19,36,0.6);padding:4px 8px;border-radius:6px;
  border:1px solid var(--panel-border);
}
[data-theme="light"] .illustration-box .ill-label{background:rgba(255,255,255,0.85)}

.info-box{
  background:var(--panel);backdrop-filter:blur(12px);
  border:1px solid var(--panel-border);border-radius:var(--radius);
  padding:16px 18px;overflow-y:auto;
}
.info-box h3{
  font-size:14.5px;color:var(--neon);margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.info-box h3 svg{width:16px;height:16px}
.info-box p{font-size:13px;color:var(--text-soft);margin-bottom:8px;line-height:1.6}
.info-box ul{list-style:none;padding:0;margin:6px 0}
.info-box ul li{
  font-size:12.5px;color:var(--text-soft);padding:5px 0 5px 18px;position:relative;
  line-height:1.55;
}
.info-box ul li::before{
  content:"";position:absolute;left:0;top:11px;width:6px;height:6px;
  border-radius:2px;background:var(--cyan);
  box-shadow:0 0 6px var(--cyan);
}
.info-box ul li strong{color:var(--heading);font-weight:600}

/* Tag / badge */
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600;
  background:rgba(34,211,238,0.10);border:1px solid rgba(34,211,238,0.25);
  color:var(--neon);letter-spacing:0.02em;
}
.tag.orange{background:rgba(249,115,22,0.10);border-color:rgba(249,115,22,0.3);color:var(--orange)}
.tag.red{background:rgba(239,68,68,0.10);border-color:rgba(239,68,68,0.3);color:var(--red)}
.tag.green{background:rgba(16,185,129,0.10);border-color:rgba(16,185,129,0.3);color:var(--green)}
.tag.amber{background:rgba(245,158,11,0.10);border-color:rgba(245,158,11,0.3);color:var(--amber)}
.tag.steel{background:rgba(148,163,184,0.10);border-color:rgba(148,163,184,0.3);color:var(--steel)}

.note-add{
  background:rgba(245,158,11,0.06);border:1px dashed rgba(245,158,11,0.35);
  border-radius:10px;padding:10px 12px;margin:10px 0;
  font-size:12px;color:var(--amber);display:flex;gap:8px;
}
.note-add svg{width:15px;height:15px;flex:0 0 15px;margin-top:1px}
.note-add strong{color:var(--amber)}
.note-safety{
  background:rgba(239,68,68,0.06);border:1px dashed rgba(239,68,68,0.35);
  border-radius:10px;padding:10px 12px;margin:10px 0;
  font-size:12px;color:#fca5a5;display:flex;gap:8px;
}
[data-theme="light"] .note-safety{color:#b91c1c}
.note-safety svg{width:15px;height:15px;flex:0 0 15px;margin-top:1px}

/* Tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--panel-border)}
table.tech{
  width:100%;border-collapse:collapse;font-size:12.5px;
  background:rgba(7,19,36,0.4);
}
[data-theme="light"] table.tech{background:#fff}
table.tech th,table.tech td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--panel-border)}
table.tech th{
  background:rgba(37,99,235,0.15);color:var(--neon);
  font-weight:700;font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;
}
table.tech td{color:var(--text-soft)}
table.tech tr:hover td{background:rgba(34,211,238,0.04)}
table.tech .mono{font-family:'JetBrains Mono';color:var(--cyan);font-size:12px}

/* Bottom navigation */
.bottom-nav{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 0 0;flex:0 0 auto;border-top:1px solid var(--panel-border);margin-top:8px;
}
.nav-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,0.04);border:1px solid var(--panel-border);
  color:var(--text-soft);transition:all .18s;
}
.nav-btn:hover:not(:disabled){color:var(--neon);border-color:var(--neon);background:rgba(34,211,238,0.06)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn svg{width:15px;height:15px}
.page-indicator{display:flex;gap:5px;align-items:center}
.page-dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(148,163,184,0.25);cursor:pointer;transition:all .2s;
}
.page-dot:hover{background:rgba(34,211,238,0.5)}
.page-dot.active{background:var(--neon);box-shadow:0 0 8px var(--neon);width:22px;border-radius:4px}

/* Tool grid / card grid */
.grid-cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;
  align-content:start;
}
.tool-card{
  background:var(--panel);backdrop-filter:blur(10px);
  border:1px solid var(--panel-border);border-radius:var(--radius);
  padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
}
.tool-card:hover{
  border-color:var(--neon);transform:translateY(-2px);
  box-shadow:0 10px 24px -8px rgba(34,211,238,0.3);
}
.tool-card .tc-num{
  position:absolute;top:8px;right:10px;
  font-family:'JetBrains Mono';font-size:10px;color:var(--text-dim);
}
.tool-card .tc-ill{
  width:100%;height:90px;border-radius:10px;
  background:linear-gradient(180deg,rgba(7,19,36,0.5),rgba(11,30,53,0.5));
  border:1px solid var(--panel-border);
  display:grid;place-items:center;margin-bottom:10px;color:var(--neon);
}
[data-theme="light"] .tool-card .tc-ill{background:linear-gradient(180deg,#eef4fb,#dbe7f5)}
.tool-card .tc-ill svg{width:42px;height:42px}
.tool-card .tc-name{font-size:13px;font-weight:700;color:var(--heading);margin-bottom:3px}
.tool-card .tc-en{font-size:10.5px;color:var(--text-dim);font-style:italic}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;
  background:rgba(7,19,36,0.78);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:24px;
}
.modal-backdrop.active{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:linear-gradient(180deg,var(--navy-700),var(--navy-800));
  border:1px solid var(--panel-border);border-radius:var(--radius-lg);
  max-width:780px;width:100%;max-height:88vh;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 30px 80px -20px rgba(0,0,0,0.7),0 0 0 1px rgba(34,211,238,0.1);
}
[data-theme="light"] .modal{background:#fff}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--panel-border);
  background:rgba(34,211,238,0.04);
}
.modal-head h3{font-size:15px;color:var(--neon);display:flex;align-items:center;gap:10px}
.modal-head .modal-close{
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  color:var(--text-dim);background:rgba(255,255,255,0.05);
}
.modal-head .modal-close:hover{color:var(--red);background:rgba(239,68,68,0.1)}
.modal-body{padding:18px;overflow-y:auto}

/* Mobile */
.mobile-menu-btn{display:none}
@media(max-width:880px){
  .app-shell{
    grid-template-columns:1fr;
    grid-template-areas:"header" "main";
  }
  .app-sidebar{
    position:fixed;top:var(--header-h);left:0;bottom:0;width:280px;
    transform:translateX(-100%);transition:transform .3s;z-index:60;
  }
  .app-shell.sidebar-open .app-sidebar{transform:translateX(0)}
  .mobile-menu-btn{display:grid}
  .sidebar-collapsed .app-sidebar{width:280px}
  .sidebar-collapsed .nav-item .nav-label,
  .sidebar-collapsed .nav-section-title,
  .sidebar-collapsed .sidebar-foot{display:block}
  .panel-title{font-size:18px}
  .panel-subtitle{display:none}
  .material-select{display:none}
  .header-titles .t2{display:none}
  .header-titles .t1{font-size:12px}
  .header-logo{padding:4px 6px;gap:6px}
  .logo-mark{width:32px;height:32px}
  .header-sep,.header-section{display:none}
  .header-actions{gap:4px}
  .icon-btn{width:34px;height:34px}
  .main-content{padding:10px}
  .panel-stage{inset:10px}
  .bottom-nav{flex-wrap:wrap}
  .panel-body{overflow-y:auto!important;-webkit-overflow-scrolling:touch}
  .two-col{grid-template-columns:1fr;gap:10px}
  .sim-canvas{height:240px!important}
  .three-stage{min-height:220px}
  .illustration-box{min-height:200px}
  .home-hero-right{min-height:180px}
  .home-stats{grid-template-columns:repeat(2,1fr)}
  .home-hero-title{font-size:26px}
  .home-hero-tags .tag{font-size:9.5px;padding:2px 7px}
  .home-hero-actions{flex-wrap:wrap}
  .btn-primary,.btn-ghost{padding:9px 14px;font-size:12px}
}
@media(max-width:880px) and (min-width:560px){
  .material-select{display:block}
  .header-titles .t1{font-size:13px}
}

/* Arc animation utility */
@keyframes arcPulse{
  0%,100%{opacity:.85;filter:blur(0.5px)}
  50%{opacity:1;filter:blur(1.2px)}
}
@keyframes sparkFly{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--sx,40px),var(--sy,-30px)) scale(0.2);opacity:0}
}

/* Loading / empty state */
.loading{padding:30px;text-align:center;color:var(--text-dim)}

/* Hero specific */
.hero-arc{
  position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);
  width:min(520px,80%);aspect-ratio:1;pointer-events:none;
  z-index:0;
}

/* Quiz */
.quiz-progress{
  height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin-bottom:14px;
}
.quiz-progress-bar{
  height:100%;background:linear-gradient(90deg,var(--electric),var(--neon));
  border-radius:3px;transition:width .3s;box-shadow:0 0 8px var(--neon);
}
.quiz-option{
  display:flex;align-items:center;gap:12px;padding:13px 14px;margin:7px 0;
  border-radius:10px;background:rgba(255,255,255,0.03);
  border:1px solid var(--panel-border);cursor:pointer;transition:all .18s;
  font-size:13.5px;color:var(--text-soft);
}
.quiz-option:hover{border-color:var(--neon);background:rgba(34,211,238,0.06)}
.quiz-option .opt-key{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  font-family:'JetBrains Mono';font-weight:700;font-size:13px;
  background:rgba(34,211,238,0.10);color:var(--neon);border:1px solid var(--panel-border);
}
.quiz-option.correct{background:rgba(16,185,129,0.10);border-color:var(--green);color:#6ee7b7}
.quiz-option.correct .opt-key{background:var(--green);color:#fff}
.quiz-option.wrong{background:rgba(239,68,68,0.10);border-color:var(--red);color:#fca5a5}
.quiz-option.wrong .opt-key{background:var(--red);color:#fff}
.quiz-option.disabled{pointer-events:none;opacity:.7}

/* Video library */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;align-content:start}
.video-card{
  background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:all .2s;
}
.video-card:hover{border-color:var(--neon);transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(34,211,238,0.3)}
.video-thumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.video-thumb img{width:100%;height:100%;object-fit:cover}
.video-thumb .play-overlay{
  position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(7,19,36,0.45);transition:background .2s;
}
.video-card:hover .play-overlay{background:rgba(7,19,36,0.25)}
.video-thumb .play-icon{
  width:54px;height:54px;border-radius:50%;
  background:rgba(239,68,68,0.92);display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 20px rgba(239,68,68,0.5);
}
.video-info{padding:10px 12px}
.video-info .v-cat{font-size:10px;color:var(--neon);font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
.video-info .v-title{font-size:12.5px;color:var(--heading);margin-top:3px;line-height:1.4}

/* Tabs */
.tab-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab-btn{
  padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,0.04);border:1px solid var(--panel-border);
  color:var(--text-dim);transition:all .15s;
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{
  background:linear-gradient(135deg,var(--electric),var(--cyan));color:#fff;
  border-color:transparent;box-shadow:0 4px 12px -3px rgba(34,211,238,0.45);
}

/* Stat block */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat{
  background:rgba(7,19,36,0.4);border:1px solid var(--panel-border);
  border-radius:10px;padding:10px 12px;
}
[data-theme="light"] .stat{background:#fff}
.stat .v{font-family:'Orbitron';font-size:18px;font-weight:700;color:var(--neon)}
.stat .l{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px}

/* Position diagram grid */
.pos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pos-card{
  background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
  padding:12px;cursor:pointer;transition:all .18s;text-align:center;
}
.pos-card:hover{border-color:var(--neon);transform:translateY(-2px)}
.pos-card.active{
  border-color:var(--neon);background:rgba(34,211,238,0.06);
  box-shadow:0 6px 18px -6px rgba(34,211,238,0.4);
}
.pos-card .pos-code{
  font-family:'Orbitron';font-size:18px;font-weight:700;color:var(--neon);
}
.pos-card .pos-name{font-size:11px;color:var(--text-dim);margin-top:3px}

/* defect list */
.defect-list{display:flex;flex-direction:column;gap:6px}
.defect-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;
  background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);
  border-radius:9px;cursor:pointer;transition:all .15s;
}
.defect-item:hover{border-color:var(--neon);background:rgba(34,211,238,0.05)}
.defect-item.active{border-color:var(--red);background:rgba(239,68,68,0.06)}
.defect-item .di-num{
  font-family:'JetBrains Mono';font-size:11px;color:var(--text-dim);
  width:22px;
}
.defect-item .di-name{font-size:12.5px;color:var(--text-soft);font-weight:600;flex:1}
.defect-item .di-tag{font-size:10px;padding:2px 7px;border-radius:5px;background:rgba(239,68,68,0.12);color:#fca5a5}

/* SMAW animation canvas wrapper */
.sim-wrap{
  background:linear-gradient(180deg,rgba(7,19,36,0.7),rgba(11,30,53,0.7));
  border:1px solid var(--panel-border);border-radius:var(--radius);
  padding:0;overflow:hidden;position:relative;display:flex;flex-direction:column;
}
.sim-canvas{display:block;width:100%;height:100%;background:transparent}
.sim-controls{
  display:flex;gap:6px;flex-wrap:wrap;padding:10px;
  background:rgba(7,19,36,0.5);border-top:1px solid var(--panel-border);
  align-items:center;
}
.sim-controls .ctrl-group{
  display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);
  padding:5px 9px;background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);border-radius:8px;
}
.sim-controls input[type=range]{
  -webkit-appearance:none;appearance:none;width:80px;height:4px;
  background:rgba(34,211,238,0.2);border-radius:2px;outline:none;
}
.sim-controls input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--neon);cursor:pointer;box-shadow:0 0 8px var(--neon);
}

/* Three.js canvas */
.three-stage{
  background:radial-gradient(circle at 50% 40%,rgba(34,211,238,0.08),transparent 60%),
    linear-gradient(180deg,rgba(7,19,36,0.7),rgba(11,30,53,0.7));
  border:1px solid var(--panel-border);border-radius:var(--radius);
  overflow:hidden;position:relative;flex:1;min-height:280px;
}
.three-stage canvas{display:block;cursor:grab}
.three-stage canvas:active{cursor:grabbing}
.three-overlay{
  position:absolute;top:10px;left:12px;display:flex;flex-direction:column;gap:5px;
  font-family:'JetBrains Mono';font-size:10.5px;color:var(--cyan);
  text-shadow:0 1px 4px rgba(0,0,0,0.6);
  pointer-events:none;
}
.three-controls{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;background:rgba(7,19,36,0.7);
  padding:6px;border-radius:10px;border:1px solid var(--panel-border);
}
.three-controls button{
  width:32px;height:32px;border-radius:7px;display:grid;place-items:center;
  color:var(--text-dim);background:rgba(255,255,255,0.04);transition:all .15s;
}
.three-controls button:hover{color:var(--neon);background:rgba(34,211,238,0.1)}
.three-controls button svg{width:15px;height:15px}

/* Divider */
.divider{height:1px;background:var(--panel-border);margin:12px 0}

/* Pill inline */
.kbd{
  display:inline-block;font-family:'JetBrains Mono';font-size:10.5px;
  padding:2px 6px;border-radius:5px;background:rgba(34,211,238,0.10);
  border:1px solid var(--panel-border);color:var(--neon);
}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(7,19,36,0.95);border:1px solid var(--panel-border);
  padding:11px 18px;border-radius:10px;font-size:12.5px;color:var(--text);
  box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
  z-index:200;opacity:0;pointer-events:none;transition:all .3s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* Section heading inside content */
.sec-h{
  font-size:13px;font-weight:700;color:var(--neon);
  display:flex;align-items:center;gap:8px;margin:14px 0 8px;
  letter-spacing:0.02em;
}
.sec-h::before{
  content:"";width:4px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,var(--neon),var(--electric));
  box-shadow:0 0 8px var(--neon);
}
.sec-h.en{color:var(--text-dim);font-size:11.5px;font-weight:500;letter-spacing:0.05em}
.sec-h.en::before{display:none}

/* Comparison row */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare-card{
  border-radius:12px;padding:12px;border:1px solid var(--panel-border);
  background:rgba(255,255,255,0.02);
}
.compare-card.good{border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.05)}
.compare-card.bad{border-color:rgba(239,68,68,0.4);background:rgba(239,68,68,0.05)}
.compare-card h4{font-size:12.5px;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.compare-card.good h4{color:#6ee7b7}
.compare-card.bad h4{color:#fca5a5}
.compare-card ul li{font-size:11.5px;padding:3px 0 3px 16px}
.compare-card ul li::before{width:5px;height:5px;top:11px}

/* Home hero */
.home-hero{
  display:grid;grid-template-columns:1.2fr 1fr;gap:18px;flex:1;min-height:0;
}
@media(max-width:980px){.home-hero{grid-template-columns:1fr}}
.home-hero-left{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:8px 4px}
.home-hero-title{
  font-family:'Orbitron';font-size:clamp(26px,4vw,42px);font-weight:800;
  line-height:1.05;letter-spacing:0.02em;
  background:linear-gradient(135deg,#F8FAFC 0%,#22D3EE 50%,#2563EB 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.home-hero-sub{font-size:13px;color:var(--text-dim);max-width:540px;line-height:1.6}
.home-hero-tags{display:flex;gap:7px;flex-wrap:wrap}
.home-hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:700;
  background:linear-gradient(135deg,var(--electric),var(--cyan));
  color:#fff;box-shadow:0 8px 24px -6px rgba(34,211,238,0.5);
  transition:all .2s;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px -6px rgba(34,211,238,0.6)}
.btn-ghost{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;
  background:rgba(255,255,255,0.04);border:1px solid var(--panel-border);color:var(--text-soft);
}
.btn-ghost:hover{border-color:var(--neon);color:var(--neon)}
.home-hero-right{
  position:relative;border-radius:var(--radius-lg);overflow:hidden;
  background:radial-gradient(circle at 50% 50%,rgba(34,211,238,0.10),transparent 60%),
    linear-gradient(180deg,rgba(7,19,36,0.6),rgba(11,30,53,0.6));
  border:1px solid var(--panel-border);min-height:260px;
}
.home-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
@media(max-width:780px){.home-stats{grid-template-columns:repeat(2,1fr)}}

/* footer of panel */
.panel-foot-mini{
  display:flex;justify-content:space-between;align-items:center;
  font-size:10.5px;color:var(--text-dim);padding-top:6px;
}

/* utility */
.flex{display:flex}
.col{flex-direction:column}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}
.text-dim{color:var(--text-dim)}
.text-cyan{color:var(--cyan)}
.text-neon{color:var(--neon)}
.text-sm{font-size:12px}
.text-xs{font-size:11px}
.hidden{display:none!important}
.center{display:grid;place-items:center}
.grow{flex:1;min-width:0}

/* ================================================================
   ATMI WELDING • REFINED INDUSTRIAL STUDIO / UI VERSION 2
   Design-only layer: curriculum, interaction and simulations retained.
   ================================================================ */
:root{
  --navy-900:#08111f; --navy-800:#0c1a2c; --navy-700:#11233a;
  --navy-600:#162d46; --navy-500:#27425c;
  --electric:#3d76f6; --cyan:#20b9d7; --neon:#67def0;
  --bg:#08111e; --bg-2:#0b1728; --bg-3:#11233a;
  --panel:rgba(17,32,52,.88); --panel-solid:#112137;
  --panel-border:rgba(158,196,230,.15); --panel-glow:rgba(32,185,215,.10);
  --text:#dae7f5; --text-dim:#94a9c0; --text-soft:#c2d2e2;
  --heading:#f5faff; --accent:#3d76f6; --accent-2:#20b9d7;
  --accent-glow:rgba(39,167,215,.22);
  --shadow:0 8px 24px rgba(3,11,24,.18);
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --header-h:72px; --sidebar-w:266px; --sidebar-w-collapsed:76px;
  --grid-line:rgba(109,164,212,.032);
}
[data-theme="light"]{
  --bg:#f3f7fc; --bg-2:#eaf0f8; --bg-3:#dce8f4;
  --panel:rgba(255,255,255,.94); --panel-solid:#ffffff;
  --panel-border:rgba(51,86,126,.14); --panel-glow:rgba(37,99,235,.07);
  --text:#1c304b; --text-dim:#5d7289; --text-soft:#39506a; --heading:#0c213b;
  --electric:#255edb; --cyan:#087b9f; --neon:#0a7593;
  --accent:#255edb; --accent-2:#087b9f; --accent-glow:rgba(37,99,235,.14);
  --shadow:0 8px 28px rgba(52,79,122,.065); --grid-line:rgba(43,84,145,.035);
}
body{font-size:14px;line-height:1.58;letter-spacing:.004em}
h1,h2,h3,h4{letter-spacing:-.022em}
button,select,input{font:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,[role="button"]:focus-visible{
  outline:2px solid var(--cyan);outline-offset:3px;
}
.app-shell{
  background:radial-gradient(ellipse 680px 520px at 84% -12%,rgba(38,105,193,.12),transparent 74%),
  linear-gradient(145deg,var(--bg),var(--bg-2) 70%);
}
.app-shell::before{background-size:56px 56px;opacity:.52;mask-image:linear-gradient(90deg,transparent 24%,black 85%)}
.app-header{
  padding:0 23px;gap:15px;
  background:rgba(9,20,35,.94);border-bottom:1px solid var(--panel-border);
  box-shadow:none;backdrop-filter:blur(24px);
}
[data-theme="light"] .app-header{background:rgba(255,255,255,.94)}
.header-logo{padding:0;border:0;background:none;gap:11px;min-width:0}
.logo-mark{
  flex:0 0 39px;width:39px;height:39px;border-radius:12px;
  background:linear-gradient(143deg,#3979ea 0%,#20c0d9 100%);
  box-shadow:0 4px 20px rgba(35,123,206,.20);
}
.logo-mark::after{opacity:.4}
.header-titles{gap:5px;min-width:0}
.header-titles .t1{font-size:12.5px;letter-spacing:.075em;font-weight:700;color:var(--heading)}
.header-titles .t2{font-size:10.5px;letter-spacing:.04em;color:var(--text-dim)}
.header-titles .t1-compact{display:none}
.header-sep{height:30px}
.header-badge{background:rgba(35,154,177,.07);color:var(--text-soft);border-color:var(--panel-border);letter-spacing:.07em}
.header-badge .dot{background:var(--cyan);box-shadow:none;animation:none}
.header-actions{gap:9px}
.icon-btn{
  border-radius:11px;width:39px;height:39px;
  background:rgba(156,198,242,.045);border-color:var(--panel-border);
  color:var(--text-soft);
}
.icon-btn:hover,.collapse-btn:hover{
  transform:none;background:rgba(40,161,207,.09);border-color:rgba(40,175,224,.38);
  color:var(--cyan);
}
.material-select select{
  border-radius:11px;background:rgba(148,183,222,.06);
  font-size:12px;color:var(--text);font-weight:600;padding:11px 35px 11px 14px;
  max-width:235px;
}
.material-select select option{color:#0c2034;background:#f8fbff}
[data-theme="dark"] .material-select select option{color:#e5f2ff;background:#142338}
.material-select::after{border-color:var(--cyan)}
/* Intentionally calm sidebar: title > search > grouped navigation */
.app-sidebar{
  background:linear-gradient(180deg,rgba(13,27,44,.98),rgba(10,22,36,.98));
  border-right-color:var(--panel-border);backdrop-filter:blur(20px);
}
[data-theme="light"] .app-sidebar{background:linear-gradient(180deg,#fff,#f6f9fd)}
.sidebar-head{padding:21px 17px 10px;border:0;gap:6px}
.sidebar-head .label{font-size:10px;color:var(--text-dim);letter-spacing:.16em}
.sidebar-count{
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cyan);
  margin-top:3px;display:block;
}
.collapse-btn{width:31px;height:31px;border-radius:9px;background:rgba(149,184,226,.055)}
.sidebar-search{
  height:40px;display:flex;align-items:center;gap:8px;

}
.sidebar-search:focus-within{border-color:rgba(32,185,215,.48);background:rgba(32,185,215,.055)}
.sidebar-search svg{width:15px;height:15px;flex:none}
.sidebar-search input{
  border:0;outline:0;color:var(--text);background:transparent;
  font-size:12px;line-height:1;width:100%;min-width:0;
}
.sidebar-search input::placeholder{color:var(--text-dim);opacity:.82}
.sidebar-search input:focus-visible{outline:0}
.nav-scroll{padding:0 11px 16px;scrollbar-width:thin}
.nav-section-title{font-size:9.5px;letter-spacing:.17em;padding:15px 11px 7px;font-weight:700}
.nav-item{
  width:100%;text-align:left;min-height:42px;gap:11px;padding:5px 9px;
  font-size:12.5px;letter-spacing:0;margin:2px 0;
  border:1px solid transparent;border-radius:11px;
  color:var(--text-soft);white-space:normal;
}
.nav-item .nav-icon{
  width:31px;height:31px;flex:0 0 31px;border-radius:9px;
  background:rgba(149,184,226,.055);border-color:transparent;color:var(--text-dim);
}
.nav-item .nav-icon svg{width:16px;height:16px}
.nav-item .nav-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .nav-num{
  font-size:9.5px;padding:0;background:none;color:var(--text-dim);opacity:.7
}
.nav-item:hover{background:rgba(143,194,240,.07);color:var(--heading)}
.nav-item:hover .nav-icon{background:rgba(35,161,207,.12);color:var(--cyan);border-color:transparent}
.nav-item.active{
  color:var(--heading);border-color:rgba(67,143,216,.29);
  background:linear-gradient(94deg,rgba(44,101,190,.23),rgba(28,131,165,.065));

}

  background:linear-gradient(145deg,#2e68db,#1b9aba);color:#fff;
  box-shadow:none;
}
.nav-item.active .nav-num{color:var(--cyan);background:none;opacity:1}
.nav-item.active::before{
  width:3px;height:21px;left:-11px;border-radius:0 3px 3px 0;
  background:var(--cyan);box-shadow:none;
}
.nav-empty{padding:12px 8px;font-size:12px;color:var(--text-dim);text-align:center}
.sidebar-foot{
  margin:0 13px 14px;padding:11px 12px;border:1px solid var(--panel-border);
  border-radius:11px;background:rgba(145,187,235,.03);font-size:10px;line-height:1.7;
}
.sidebar-foot strong{color:var(--text-soft);font-weight:600}
.sidebar-collapsed .sidebar-head{padding:18px 10px 10px}
.sidebar-collapsed .sidebar-head .sidebar-copy,
.sidebar-collapsed .sidebar-search,
.sidebar-collapsed .nav-item .nav-num{display:none}
.sidebar-collapsed .nav-scroll{padding:5px 10px}
.sidebar-collapsed .nav-item{padding:5px;min-height:44px;justify-content:center}
.sidebar-collapsed .nav-item .nav-icon{width:35px;height:35px;flex-basis:35px}

.app-main{min-width:0}

.main-content{padding:19px 25px 17px}

.subnav-item:hover{color:var(--heading);background:rgba(54,137,200,.09)}
.tag{

[data-theme="dark"] .tag.red{color:#ff9caa}
[data-theme="dark"] .tag.orange{color:#ffb27a}
[data-theme="dark"] .tag.amber{color:#ffcd85}
[data-theme="dark"] .tag.green{color:#6be6bb}
.note-add,.note-safety{border-radius:10px;padding:12px 14px;line-height:1.6}
.bottom-nav{padding-top:13px;margin-top:12px}
.nav-btn{padding:9px 14px;min-height:39px;font-size:12px}
.page-indicator{overflow:auto;min-width:0;max-width:44%;padding:5px 2px;scrollbar-width:none}

.stat{padding:14px;border-color:var(--panel-border);border-radius:13px;background:rgba(27,67,102,.17)}

}
.home-hero-sub{font-size:13.4px;color:var(--text-soft);line-height:1.8;max-width:570px}
.home-hero-sub strong{color:var(--heading)}
.home-hero-actions{gap:9px}
.btn-primary,.btn-ghost{border-radius:11px;font-size:12.5px;padding:11px 16px}

.btn-primary svg,.btn-ghost svg{width:17px;height:17px;flex:0 0 17px}
.home-stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:5px}
.home-hero-right{
  background:radial-gradient(ellipse at 50% 62%,rgba(26,120,191,.17),transparent 64%),

  border-color:rgba(89,155,205,.24);border-radius:21px;min-height:260px;
  box-shadow:0 18px 40px rgba(3,11,25,.15);
}
.home-hero-right::before{

    {id:'mesin',label:'Pengoperasian Mesin Las',icon:'settings',sec:'Mesin'},

    {id:'tatatertib',label:'Tata Tertib Section',icon:'book-open',sec:'Aturan'},
  ],
  els:{},
  init(){
    this.els.shell=document.getElementById('appShell');
    this.els.stage=document.getElementById('panelStage');
    this.els.navScroll=document.getElementById('navScroll');
    this.els.crumbActive=document.getElementById('crumbActive');
    this.els.materialSelect=document.getElementById('materialSelect');
    this.els.sidebar=document.getElementById('sidebar');
    // theme
    const saved=localStorage.getItem('wls-theme');
    if(saved){this.state.theme=saved;}
    document.documentElement.dataset.theme=this.state.theme;
    this.updateThemeIcon();
    // sidebar collapsed
    const col=localStorage.getItem('wls-sidebar');
    if(col==='1'){this.state.sidebarCollapsed=true;this.els.shell.classList.add('sidebar-collapsed');}
    // build nav
    this.buildNav();
    // events
    document.getElementById('themeToggle').onclick=()=>this.toggleTheme();
    document.getElementById('homeBtn').onclick=()=>this.navigate('home');
    document.getElementById('fullscreenBtn').onclick=()=>this.toggleFullscreen();
    document.getElementById('collapseBtn').onclick=()=>this.toggleSidebar();
    document.getElementById('collapseSidebar').onclick=()=>this.toggleSidebar();
    document.getElementById('mobileMenuBtn').onclick=()=>this.toggleMobileSidebar();
    document.getElementById('navScrim').onclick=()=>this.els.shell.classList.remove('sidebar-open');
    document.getElementById('moduleSearch').addEventListener('input',(e)=>this.filterNav(e.target.value));
    document.getElementById('materialSelect').onchange=(e)=>this.navigate(e.target.value);
    document.getElementById('modalClose').onclick=()=>this.closeModal();
    document.getElementById('modalBackdrop').onclick=(e)=>{if(e.target.id==='modalBackdrop')this.closeModal();};
    // keyboard
    document.addEventListener('keydown',(e)=>this.handleKey(e));
    // last position
    const last=localStorage.getItem('wls-menu');
    if(last){this.navigate(last);}else{this.navigate('home');}
    // lucide
    if(window.lucide)lucide.createIcons();
  },
  buildNav(){
    const secMap={};
    this.menus.forEach((m,i)=>{
      if(!secMap[m.sec])secMap[m.sec]=[];
      secMap[m.sec].push({...m,num:i+1});
    });
    let html='';
    for(const sec in secMap){
      const headings={Inti:'BERANDA',Teori:'DASAR & TEORI',Praktik:'PRAKTIK PENGELASAN',K3:'KESELAMATAN',Mesin:'MESIN & PROSES',Media:'MEDIA & EVALUASI',Aturan:'PANDUAN SECTION'};
      html+=`<div class="nav-section-title" data-nav-section="${sec}">${headings[sec]||sec.toUpperCase()}</div>`;
      secMap[sec].forEach(m=>{
        html+=`<button type="button" class="nav-item" data-menu="${m.id}" aria-label="Buka ${m.label}">
          <div class="nav-icon"><i data-lucide="${m.icon}"></i></div>
          <span class="nav-label">${m.label}</span>
          <span class="nav-num">${String(m.num).padStart(2,'0')}</span>
        </button>`;
      });
    }
    this.els.navScroll.innerHTML=html+'<p class="nav-empty hidden" id="navEmpty">Materi tidak ditemukan</p>';
    this.els.navScroll.querySelectorAll('.nav-item').forEach(el=>{
      el.onclick=()=>this.navigate(el.dataset.menu);
    });
  },
  filterNav(query){
    const norm=s=>String(s).toLocaleLowerCase('id-ID').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const q=norm(query.trim());
    let visibleCount=0;
    this.els.navScroll.querySelectorAll('.nav-item').forEach(el=>{
      const show=!q||norm(el.querySelector('.nav-label')?.textContent||'').includes(q);
      el.classList.toggle('hidden',!show);
      visibleCount+=Number(show);
    });
    this.els.navScroll.querySelectorAll('[data-nav-section]').forEach(title=>{
      let sibling=title.nextElementSibling, found=false;
      while(sibling&&!sibling.hasAttribute('data-nav-section')){
        if(sibling.classList.contains('nav-item')&&!sibling.classList.contains('hidden'))found=true;
        sibling=sibling.nextElementSibling;
      }
      title.classList.toggle('hidden',!found);
    });
    document.getElementById('navEmpty').classList.toggle('hidden',visibleCount!==0);
  },
  navigate(menuId){
    this.state.menu=menuId;
    this.els.shell.classList.toggle('home-view',menuId==='home');
    this.state.sub=0;
    localStorage.setItem('wls-menu',menuId);
    // update nav active
    this.els.navScroll.querySelectorAll('.nav-item').forEach(el=>{
      el.classList.toggle('active',el.dataset.menu===menuId);
    });
    // update select
    this.els.materialSelect.value=menuId;
    // breadcrumb
    const m=this.menus.find(x=>x.id===menuId);
    this.els.crumbActive.textContent=m?m.label:'Beranda';
    const moduleIndex=Math.max(0,this.menus.findIndex(x=>x.id===menuId));
    document.getElementById('moduleCounter').textContent=`${String(moduleIndex+1).padStart(2,'0')} / ${this.menus.length}`;
    document.getElementById('crumbProgress').style.width=`${(moduleIndex+1)/this.menus.length*100}%`;
    // Return sidebar to full curriculum after a search selection.
    const moduleSearch=document.getElementById('moduleSearch');
    if(moduleSearch && moduleSearch.value){moduleSearch.value='';this.filterNav('');}
    // close mobile sidebar
    this.els.shell.classList.remove('sidebar-open');
    // render with animation
    this.render(menuId);
    if(window.lucide)lucide.createIcons();
    // scroll nav into view
    const activeNav=this.els.navScroll.querySelector('.nav-item.active');
    if(activeNav)activeNav.scrollIntoView({block:'nearest',behavior:'smooth'});
  },
  cleanupStage(){
    // Stop inactive animation loops and event listeners when a lesson changes.
    if(this._homeArcStop){this._homeArcStop();this._homeArcStop=null;}
    if(this.smawAnim){
      cancelAnimationFrame(this.smawAnim.raf);
      if(this.smawAnim._resizeHandler)window.removeEventListener('resize',this.smawAnim._resizeHandler);
      this.smawAnim=null;
    }
    if(this.threeApp){this.threeApp.dispose();this.threeApp=null;}
  },
  render(menuId){
    const stage=this.els.stage;
    this.cleanupStage();
    stage.classList.add('exit');
    clearTimeout(this._renderTimer);
    this._renderTimer=setTimeout(()=>{
      stage.classList.remove('exit');
      const fn=this.renderers[menuId]||this.renderers.placeholder;
      stage.innerHTML=fn.call(this);
      stage.style.animation='none';
      void stage.offsetWidth;
      stage.style.animation='';
      if(window.lucide)lucide.createIcons();
      // bind dynamic events
      this.afterRender(menuId);
    },160);
  },
  afterRender(menuId){
    // generic: bind nav buttons
    const prev=this.els.stage.querySelector('[data-act="prev"]');
    const next=this.els.stage.querySelector('[data-act="next"]');
    if(prev)prev.onclick=()=>this.stepSub(-1);
    if(next)next.onclick=()=>this.stepSub(1);
    // subnav
    this.els.stage.querySelectorAll('[data-sub]').forEach(el=>{
      el.onclick=()=>{this.state.sub=parseInt(el.dataset.sub);this.render(menuId);};
    });
    // bind specific
    const binder=this.binders[menuId];
    if(binder)binder.call(this);
  },
  stepSub(dir){
    const renderer=this.renderers[this.state.menu];
    if(!renderer||!renderer.subPages)return;
    const total=renderer.subPages.length;
    this.state.sub=Math.max(0,Math.min(total-1,this.state.sub+dir));
    this.render(this.state.menu);
  },
  handleKey(e){
    if(e.key==='Escape'){this.closeModal();this.els.shell.classList.remove('sidebar-open');return;}
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
    if(e.key==='ArrowRight'){this.stepSub(1);}
    else if(e.key==='ArrowLeft'){this.stepSub(-1);}
  },
  toggleTheme(){
    this.state.theme=this.state.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=this.state.theme;
    localStorage.setItem('wls-theme',this.state.theme);
    this.updateThemeIcon();

    // re-render charts/canvas that depend on theme

    if(this.state.menu==='posisi'&&this.threeApp)this.threeApp.refreshTheme();
  },
  updateThemeIcon(){
    const ic=document.getElementById('themeIcon');
    if(ic)ic.setAttribute('data-lucide',this.state.theme==='dark'?'sun':'moon');
  },
  toggleSidebar(){
    this.state.sidebarCollapsed=!this.state.sidebarCollapsed;
    this.els.shell.classList.toggle('sidebar-collapsed',this.state.sidebarCollapsed);
    localStorage.setItem('wls-sidebar',this.state.sidebarCollapsed?'1':'0');
    if(window.lucide)lucide.createIcons();
  },
  toggleMobileSidebar(){
    this.els.shell.classList.toggle('sidebar-open');
  },
  toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.();

  },
  toast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT=setTimeout(()=>t.classList.remove('show'),2400);
  },
  openModal(title,html){
    document.getElementById('modalTitle').innerHTML=title;
    document.getElementById('modalBody').innerHTML=html;
    document.getElementById('modalBackdrop').classList.add('active');
    if(window.lucide)lucide.createIcons();
  },
  closeModal(){
    document.getElementById('modalBackdrop').classList.remove('active');
  },
  // helpers
  pageNav(current,total,label){
    let dots='';
    for(let i=0;i<total;i++){
      dots+=`<button type="button" class="page-dot ${i===current?'active':''}" data-sub="${i}" aria-label="Buka halaman ${i+1}" ${i===current?'aria-current="step"':''}></button>`;

      <button class="nav-btn" data-act="prev" ${current===0?'disabled':''}>
        <i data-lucide="chevron-left"></i> Sebelumnya

      <button class="nav-btn" data-act="next" ${current===total-1?'disabled':''}>
        Berikutnya <i data-lucide="chevron-right"></i>
      </button>
    </div>`;
  },
  subnav(items,current){
    return `<div class="subnav" aria-label="Submateri">${items.map((it,i)=>`<button type="button" class="subnav-item ${i===current?'active':''}" data-sub="${i}" ${i===current?'aria-current="step"':''}>${it}</button>`).join('')}</div>`;
  },
  renderers:{},
  binders:{},
  // placeholder
  placeholder(){return '<div class="loading">Materi sedang disiapkan...</div>';}
};

App.startHomeArc=function(canvas){
  const ctx=canvas.getContext('2d');
  let raf,w=0,h=0,t=0;
  const resize=()=>{const r=canvas.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;w=r.width;h=r.height;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);};
  resize();window.addEventListener('resize',resize);
  const sparks=Array.from({length:18},()=>({a:Math.random()*Math.PI*2,s:0.6+Math.random()*1.4,life:Math.random()}));
  const draw=()=>{
    ctx.clearRect(0,0,w,h);
    const cx=w/2,cy=h*0.62;
    // Scale the weld itself, not just the canvas: keeps the operation readable.
    const sceneScale=Math.min(2.2,Math.max(1,Math.min(w/300,h/240)));
    ctx.save();
    ctx.translate(cx,cy);ctx.scale(sceneScale,sceneScale);ctx.translate(-cx,-cy);
    // workpiece
    ctx.fillStyle='rgba(71,85,105,0.5)';
    ctx.fillRect(cx-90,cy+18,180,12);
    ctx.strokeStyle='rgba(148,163,184,0.4)';ctx.lineWidth=1;
    ctx.strokeRect(cx-90,cy+18,180,12);
    // electrode
    const ex=cx,ey=cy-10+Math.sin(t*0.05)*2;
    ctx.fillStyle='#94A3B8';
    ctx.fillRect(ex-3,ey-60,6,55);
    ctx.fillStyle='#cbd5e1';
    ctx.fillRect(ex-3,ey-60,6,4);
    // arc
    const grad=ctx.createRadialGradient(ex,ey,2,ex,cy+18,28);
    grad.addColorStop(0,'rgba(255,255,255,0.95)');
    grad.addColorStop(0.3,'rgba(34,211,238,0.8)');
    grad.addColorStop(0.7,'rgba(37,99,235,0.4)');
    grad.addColorStop(1,'rgba(37,99,235,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(ex,cy+18,28,0,Math.PI*2);ctx.fill();
    // bright core
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath();ctx.arc(ex,cy+18,4+Math.sin(t*0.3)*1.5,0,Math.PI*2);ctx.fill();
    // sparks
    sparks.forEach(s=>{
      s.life+=0.02;if(s.life>1){s.life=0;s.a=Math.random()*Math.PI*2-Math.PI;}
      const dist=s.life*70;
      const sx=ex+Math.cos(s.a)*dist;
      const sy=cy+18+Math.sin(s.a)*dist*0.6+ s.life*15;
      ctx.fillStyle=`rgba(255,${180-s.life*100|0},80,${1-s.life})`;
      ctx.beginPath();ctx.arc(sx,sy,1.5*(1-s.life*0.5),0,Math.PI*2);ctx.fill();
    });
    // weld bead
    ctx.fillStyle='rgba(249,115,22,0.7)';
    for(let i=-3;i<=3;i++){
      ctx.beginPath();ctx.arc(ex+i*7,cy+18,3.5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    t++;
    raf=requestAnimationFrame(draw);
  };
  draw();
  this._homeArcStop=()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize);};
};

/* SMAW Animation Engine */
class SMAWSim{
  constructor(canvas,app){
    this.cv=canvas;this.app=app;
    this.ctx=canvas.getContext('2d');
    this.playing=true;this.t=0;
    this.elecLen=0;this.beads=[];
    this.angle=75;this.arcLen=14;this.speed=1;
    this.sparks=[];
    this.resize();
    this._resizeHandler=()=>this.resize();
    window.addEventListener('resize',this._resizeHandler);
    this.bind();
    this.loop();
    this.updateInfo();
  }
  resize(){
    const r=this.cv.getBoundingClientRect();
    this.cv.width=r.width*devicePixelRatio;this.cv.height=r.height*devicePixelRatio;
    this.w=r.width;this.h=r.height;
    this.ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    this.totalLen=this.w-120;
  }
  bind(){
    const play=document.getElementById('simPlay');
    play.onclick=()=>{this.playing=!this.playing;play.innerHTML=this.playing?'<i data-lucide="pause"></i> Pause':'<i data-lucide="play"></i> Play';if(window.lucide)lucide.createIcons();};
    document.getElementById('simReset').onclick=()=>{this.t=0;this.elecLen=0;this.beads=[];this.sparks=[];this.updateInfo();};
    const ang=document.getElementById('simAngle');
    ang.oninput=()=>{this.angle=+ang.value;document.getElementById('simAngleV').textContent=this.angle+'°';this.updateInfo();};
    const arc=document.getElementById('simArc');
    arc.oninput=()=>{this.arcLen=+arc.value;document.getElementById('simArcV').textContent=this.arcLen+'px';this.updateInfo();};
    const sp=document.getElementById('simSpeed');
    sp.oninput=()=>{this.speed=+sp.value;document.getElementById('simSpeedV').textContent=this.speed.toFixed(1)+'×';};
  }
  updateInfo(){
    const el=document.getElementById('simInfo');
    if(!el)return;
    const arcQuality=this.arcLen>22?'terlalu panjang':this.arcLen<8?'terlalu pendek':'ideal (1× diameter)';
    const angleQuality=this.angle<65?'terlalu kecil':this.angle>85?'terlalu besar':'normal (drag)';
    el.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><div class="text-xs text-dim">Sudut Elektroda</div><div class="mono text-neon">${this.angle}°</div><div class="text-xs ${this.angle<65||this.angle>85?'text-red':'text-green'}">${angleQuality}</div></div>
        <div><div class="text-xs text-dim">Panjang Busur</div><div class="mono text-neon">${this.arcLen}px</div><div class="text-xs ${this.arcLen>22||this.arcLen<8?'text-red':'text-green'}">${arcQuality}</div></div>
        <div><div class="text-xs text-dim">Progres</div><div class="mono text-neon">${Math.round(this.t)}%</div></div>
        <div><div class="text-xs text-dim">Bead Terbentuk</div><div class="mono text-neon">${this.beads.length}</div></div>
      </div>`;
  }
  redraw(){/* placeholder for theme change */}
  loop(){
    if(this.playing){
      this.t+=this.speed*0.6;
      if(this.t>=this.totalLen){this.t=0;this.beads=[];this.elecLen=0;}
      this.elecLen=(this.t/this.totalLen)*40;
      // add bead periodically
      if(this.beads.length===0||Math.abs(this.beads[this.beads.length-1].x-(60+this.t))>6){
        const widthFactor=1/(1+Math.abs(this.angle-75)/30);
        const heightFactor=1+Math.abs(this.angle-75)/40;
        const spatter=this.arcLen>18?1.5:1;
        this.beads.push({x:60+this.t,w:6*widthFactor*spatter,h:5+heightFactor,quality:this.arcLen>22?'bad':'good'});
      }
      // sparks
      if(Math.random()<0.3){
        this.sparks.push({x:90+this.t,y:this.h*0.55,vx:(Math.random()-0.5)*4,vy:-Math.random()*3-1,life:1,big:this.arcLen>18});
      }
      this.sparks=this.sparks.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=0.15;s.life-=0.03;return s.life>0;});
      this.updateInfo();
    }
    this.draw();
    this.raf=requestAnimationFrame(()=>this.loop());
  }
  draw(){
    const ctx=this.ctx,w=this.w,h=this.h;
    const isDark=this.app.state.theme==='dark';
    ctx.clearRect(0,0,w,h);
    // bg grid
    ctx.strokeStyle=isDark?'rgba(34,211,238,0.04)':'rgba(37,99,235,0.05)';
    ctx.lineWidth=1;
    for(let x=0;x<w;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    // workpiece
    const wpY=h*0.6;
    ctx.fillStyle=isDark?'#475569':'#64748b';
    ctx.fillRect(40,wpY,w-80,28);
    ctx.strokeStyle=isDark?'#64748b':'#475569';
    ctx.strokeRect(40,wpY,w-80,28);
    // weld bead
    this.beads.forEach(b=>{
      ctx.fillStyle=b.quality==='bad'?'rgba(239,68,68,0.5)':'rgba(251,191,36,0.85)';
      ctx.beginPath();ctx.ellipse(b.x,wpY,b.w,b.h,0,0,Math.PI*2);ctx.fill();
      // ripple
      ctx.fillStyle='rgba(0,0,0,0.15)';
      ctx.fillRect(b.x-b.w/2,wpY-1,b.w,1);
    });
    // electrode position
    const ex=90+this.t;
    const angleRad=(this.angle-90)*Math.PI/180;
    const elecTopX=ex - Math.sin(angleRad)*60;
    const elecTopY=wpY - Math.cos(angleRad)*60 - this.elecLen;
    // holder
    ctx.fillStyle='#475569';
    ctx.save();ctx.translate(elecTopX,elecTopY);
    ctx.rotate(angleRad);
    ctx.fillRect(-12,-16,24,14);
    ctx.restore();
    // electrode (flux brown)
    ctx.save();
    ctx.translate(ex,wpY-this.arcLen);
    ctx.rotate(angleRad);
    ctx.fillStyle='#d97706';
    ctx.fillRect(-3,-60-this.elecLen,6,60+this.elecLen);
    ctx.fillStyle='#cbd5e1';
    ctx.fillRect(-3,-60-this.elecLen,6,4);
    ctx.restore();
    // arc
    const arcX=ex,arcY=wpY;
    const grad=ctx.createRadialGradient(arcX,arcY,2,arcX,arcY,this.arcLen+8);
    grad.addColorStop(0,'rgba(255,255,255,0.95)');
    grad.addColorStop(0.3,'rgba(34,211,238,0.8)');
    grad.addColorStop(0.7,'rgba(37,99,235,0.4)');
    grad.addColorStop(1,'rgba(37,99,235,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(arcX,arcY,this.arcLen+6,0,Math.PI*2);ctx.fill();
    // bright core
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.beginPath();ctx.arc(arcX,arcY,3+Math.sin(this.t*0.3)*1,0,Math.PI*2);ctx.fill();
    // weld pool (molten)
    ctx.fillStyle='rgba(249,115,22,0.7)';
    ctx.beginPath();ctx.ellipse(ex-2,wpY-1,8,3,0,0,Math.PI*2);ctx.fill();
    // sparks
    this.sparks.forEach(s=>{
      ctx.fillStyle=`rgba(255,${180-s.life*100|0},80,${s.life})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.big?2:1.2,0,Math.PI*2);ctx.fill();
    });
    // labels
    ctx.fillStyle='#22D3EE';ctx.font='600 10px JetBrains Mono';
    ctx.fillText('ELEKTRODA',12,20);
    ctx.fillText('SUDUT: '+this.angle+'°',12,36);
    ctx.fillStyle='#94a3b8';ctx.font='9px Inter';
    ctx.fillText('Busur: '+this.arcLen+'px',12,50);
    ctx.fillStyle='#10B981';
    ctx.fillText('→ TRAVEL',w-90,wpY-10);
    // progress bar
    ctx.fillStyle='rgba(255,255,255,0.05)';
    ctx.fillRect(40,h-12,w-80,3);

App.binders.elektroda=function(){
  if(this.state.sub!==3)return;
  let pol='dcsp';
  const update=()=>{
    const top=document.getElementById('polTopCharge');
    const bot=document.getElementById('polBotCharge');
    const n1=document.getElementById('polNote1');
    const n2=document.getElementById('polNote2');
    const n3=document.getElementById('polNote3');
    const heatLoc=document.getElementById('polHeatLoc');
    const heatDesc=document.getElementById('polHeatDesc');
    const cone=document.getElementById('polHeatCone');
    if(pol==='dcsp'){
      top.textContent='— (minus)';
      bot.textContent='+ (plus)';
      n1.textContent='DCSP: penetrasi dalam — baik untuk pelat tebal';
      n2.textContent='Benturan ionisasi di permukaan benda kerja';
      n3.textContent='→ Pengerjaan pelat tebal & butuh penetrasi dalam';
      heatLoc.textContent='PANAS TINGGI';
      heatDesc.textContent='di benda kerja';
      cone.setAttribute('d','M70,160 L100,160 L90,150 Z');
      heatLoc.setAttribute('y','160');
      heatDesc.setAttribute('y','172');
    }else{
      top.textContent='+ (plus)';
      bot.textContent='— (minus)';
      n1.textContent='DCRP: logam pengisi cepat mencair — pelat tipis';
      n2.textContent='Benturan ionisasi di ujung elektroda';
      n3.textContent='→ Pengerjaan pelat tipis & logam tidak tahan panas tinggi';
      heatLoc.textContent='PANAS TINGGI';
      heatDesc.textContent='di elektroda';
      cone.setAttribute('d','M150,90 L120,90 L130,80 Z');
      heatLoc.setAttribute('y','80');
      heatDesc.setAttribute('y','92');
    }
  };
  document.querySelectorAll('[data-pol]').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('[data-pol]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      pol=b.dataset.pol;update();
    };
  });
};

/* Three.js Welding 3D Visualization */
class Welding3D{
  constructor(container,app){
    this.container=container;this.app=app;
    this.group='plate';
    this.init();
  }
  init(){
    const w=this.container.clientWidth,h=this.container.clientHeight||400;
    this.scene=new THREE.Scene();
    this.scene.background=null;
    const aspect=w/Math.max(h,1);
    this.camera=new THREE.PerspectiveCamera(45,aspect,0.1,1000);
    this.camera.position.set(8,6,10);
    this.renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    this.renderer.setPixelRatio(devicePixelRatio);
    this.renderer.setSize(w,h);
    this.container.appendChild(this.renderer.domElement);
    // lights
    const amb=new THREE.AmbientLight(0x4a90e2,0.6);this.scene.add(amb);
    const dir=new THREE.DirectionalLight(0xffffff,0.9);dir.position.set(5,8,5);this.scene.add(dir);
    const dir2=new THREE.DirectionalLight(0x22D3EE,0.4);dir2.position.set(-5,4,-3);this.scene.add(dir2);
    // grid
    const grid=new THREE.GridHelper(20,20,0x22D3EE,0x1c3a5e);grid.material.opacity=0.25;grid.material.transparent=true;
    this.scene.add(grid);
    // controls (orbit) - manual simple
    this.theta=Math.PI/4;this.phi=Math.PI/3.5;this.radius=14;
    this.dragging=false;this.lastX=0;this.lastY=0;
    const dom=this.renderer.domElement;
    dom.onmousedown=(e)=>{this.dragging=true;this.lastX=e.clientX;this.lastY=e.clientY;};
    this._onMouseMove=(e)=>{if(!this.dragging)return;const dx=e.clientX-this.lastX;const dy=e.clientY-this.lastY;this.theta-=dx*0.01;this.phi=Math.max(0.1,Math.min(Math.PI-0.1,this.phi-dy*0.01));this.lastX=e.clientX;this.lastY=e.clientY;this.updateCamera();};
    this._onMouseUp=()=>{this.dragging=false;};
    window.addEventListener('mousemove',this._onMouseMove);
    window.addEventListener('mouseup',this._onMouseUp);
    dom.addEventListener('touchstart',(e)=>{if(e.touches.length){this.dragging=true;this.lastX=e.touches[0].clientX;this.lastY=e.touches[0].clientY;}},{passive:true});
    dom.addEventListener('touchmove',(e)=>{if(!this.dragging||!e.touches.length)return;const dx=e.touches[0].clientX-this.lastX;const dy=e.touches[0].clientY-this.lastY;this.theta-=dx*0.01;this.phi=Math.max(0.1,Math.min(Math.PI-0.1,this.phi-dy*0.01));this.lastX=e.touches[0].clientX;this.lastY=e.touches[0].clientY;this.updateCamera();},{passive:true});
    dom.addEventListener('touchend',()=>{this.dragging=false;});
    dom.addEventListener('wheel',(e)=>{e.preventDefault();this.radius=Math.max(5,Math.min(30,this.radius+e.deltaY*0.01));this.updateCamera();},{passive:false});
    this.buildModels();
    this.updateCamera();
    this.animate();
    window.addEventListener('resize',()=>this.resize());
    // buttons
    document.getElementById('t3dReset').onclick=()=>{this.theta=Math.PI/4;this.phi=Math.PI/3.5;this.radius=14;this.updateCamera();};
    document.getElementById('t3dFront').onclick=()=>{this.theta=0;this.phi=Math.PI/2;this.updateCamera();};
    document.getElementById('t3dSide').onclick=()=>{this.theta=Math.PI/2;this.phi=Math.PI/2;this.updateCamera();};
    document.getElementById('t3dTop').onclick=()=>{this.theta=0;this.phi=0.1;this.updateCamera();};
    document.getElementById('t3dPersp').onclick=()=>{this.theta=Math.PI/4;this.phi=Math.PI/3.5;this.updateCamera();};
    document.getElementById('t3dZoomIn').onclick=()=>{this.radius=Math.max(5,this.radius-1.5);this.updateCamera();};
    document.getElementById('t3dZoomOut').onclick=()=>{this.radius=Math.min(30,this.radius+1.5);this.updateCamera();};
  }
  buildModels(){
    this.modelGroup=new THREE.Group();this.scene.add(this.modelGroup);
    this.buildPlate();this.buildFillet();this.buildPipe();this.buildPipe6G();
    this.setGroup('plate');
  }
  buildPlate(){
    const g=new THREE.Group();g.name='plate';g.visible=false;
    const matSteel=new THREE.MeshStandardMaterial({color:0x64748b,metalness:0.7,roughness:0.4});
    const p1=new THREE.Mesh(new THREE.BoxGeometry(6,0.5,4),matSteel);p1.position.set(-3.2,0,0);g.add(p1);
    const p2=new THREE.Mesh(new THREE.BoxGeometry(6,0.5,4),matSteel);p2.position.set(3.2,0,0);g.add(p2);
    // weld bead
    const beadMat=new THREE.MeshStandardMaterial({color:0xd97706,metalness:0.6,roughness:0.5,emissive:0xf97316,emissiveIntensity:0.3});
    const bead=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.4,4.2),beadMat);bead.position.set(0,0.2,0);g.add(bead);
    // electrode
    const elecMat=new THREE.MeshStandardMaterial({color:0xd97706});
    const elec=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,2.5,12),elecMat);
    elec.position.set(2,3,0);elec.rotation.z=Math.PI/8;g.add(elec);
    this.plateGroup=g;this.modelGroup.add(g);
  }
  buildFillet(){
    const g=new THREE.Group();g.name='fillet';g.visible=false;
    const matSteel=new THREE.MeshStandardMaterial({color:0x64748b,metalness:0.7,roughness:0.4});
    const horiz=new THREE.Mesh(new THREE.BoxGeometry(6,0.5,4),matSteel);horiz.position.y=0;g.add(horiz);
    const vert=new THREE.Mesh(new THREE.BoxGeometry(0.5,3,4),matSteel);vert.position.set(0,1.5,0);g.add(vert);
    // fillet bead (triangular)
    const filletMat=new THREE.MeshStandardMaterial({color:0xd97706,metalness:0.6,roughness:0.5,emissive:0xf97316,emissiveIntensity:0.3});
    const fgeo=new THREE.BoxGeometry(0.6,0.6,4.2);
    const f1=new THREE.Mesh(fgeo,filletMat);f1.position.set(-0.3,0.3,0);g.add(f1);
    const f2=new THREE.Mesh(fgeo,filletMat);f2.position.set(0.3,0.3,0);g.add(f2);
    this.filletGroup=g;this.modelGroup.add(g);
  }
  buildPipe(){
    const g=new THREE.Group();g.name='pipe';g.visible=false;
    const matSteel=new THREE.MeshStandardMaterial({color:0x64748b,metalness:0.7,roughness:0.4});
    const pipe1=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,3,32,true),matSteel);pipe1.position.x=-1.6;g.add(pipe1);
    const pipe2=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,3,32,true),matSteel);pipe2.position.x=1.6;g.add(pipe2);
    // weld ring
    const ringMat=new THREE.MeshStandardMaterial({color:0xd97706,emissive:0xf97316,emissiveIntensity:0.3});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.15,16,32),ringMat);
    ring.rotation.y=Math.PI/2;g.add(ring);
    this.pipeGroup=g;this.modelGroup.add(g);
  }
  buildPipe6G(){
    const g=new THREE.Group();g.name='pipe6g';g.visible=false;
    const matSteel=new THREE.MeshStandardMaterial({color:0x64748b,metalness:0.7,roughness:0.4});
    const pipe=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,6,32,true),matSteel);
    pipe.rotation.z=Math.PI/4;g.add(pipe);
    const ringMat=new THREE.MeshStandardMaterial({color:0xd97706,emissive:0xf97316,emissiveIntensity:0.4});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.18,16,32),ringMat);
    ring.rotation.y=Math.PI/2;ring.rotation.z=Math.PI/4;g.add(ring);
    // support
    const supMat=new THREE.MeshStandardMaterial({color:0x334155,metalness:0.4,roughness:0.7});
    const sup=new THREE.Mesh(new THREE.BoxGeometry(0.3,3,0.3),supMat);sup.position.set(0,-2.5,-1.2);g.add(sup);
    this.pipe6Group=g;this.modelGroup.add(g);
  }
  setGroup(name){
    this.group=name;
    ['plateGroup','filletGroup','pipeGroup','pipe6Group'].forEach(k=>{
      if(this[k])this[k].visible=false;
    });
    const labels={plate:'1G — FLAT (Pelat)',fillet:'1F — FLAT (Fillet)',pipe:'1G — Rotated Pipe',pipe6g:'6G — Inclined 45° (Pipa)'};
    const lblEl=document.getElementById('threeLabel');
    if(lblEl)lblEl.textContent=labels[name]||name;
    const map={plate:'plateGroup',fillet:'filletGroup',pipe:'pipeGroup',pipe6g:'pipe6Group'};
    if(this[map[name]])this[map[name]].visible=true;
  }
  refreshTheme(){
    // could re-color grid based on theme
  }
  updateCamera(){
    const x=this.radius*Math.sin(this.phi)*Math.sin(this.theta);
    const y=this.radius*Math.cos(this.phi);
    const z=this.radius*Math.sin(this.phi)*Math.cos(this.theta);
    this.camera.position.set(x,y,z);
    this.camera.lookAt(0,0,0);
  }
  resize(){
    const w=this.container.clientWidth,h=this.container.clientHeight||400;
    this.camera.aspect=w/Math.max(h,1);this.camera.updateProjectionMatrix();
    this.renderer.setSize(w,h);
  }
  animate(){
    if(!this.renderer)return;
    this.renderer.render(this.scene,this.camera);
    this._raf=requestAnimationFrame(()=>this.animate());
  }
  dispose(){
    cancelAnimationFrame(this._raf);
    if(this._onMouseMove)window.removeEventListener('mousemove',this._onMouseMove);
    if(this._onMouseUp)window.removeEventListener('mouseup',this._onMouseUp);
    if(this.renderer){
      this.renderer.dispose();
      if(this.renderer.domElement&&this.renderer.domElement.parentNode)this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);
    }
    this.scene=null;this.renderer=null;this.camera=null;
  }
}
</script>

    <div class="two-col">
      <div class="col-left">
        <div class="illustration-box">
          <span class="ill-label">PROFIL RIGI LAS — BAIK vs BURUK</span>
          <svg viewBox="0 0 380 320" style="width:100%;max-width:460px;padding:12px">

App.binders.cacat=function(){
  if(this.state.sub===0){
    // defect detail
    const detail=document.getElementById('defectDetail');
    const show=(i)=>{
      const d=App.defects[i];
      detail.innerHTML=`
        <h3><i data-lucide="search"></i> ${d.n}</h3>
        <div style="background:rgba(7,19,36,0.5);border:1px solid var(--panel-border);border-radius:10px;height:140px;display:grid;place-items:center;margin:8px 0">

            <path d="M10,50 Q40,38 70,50 Q100,38 130,50 Q160,38 190,50" fill="#fbbf24"/>
            <circle cx="100" cy="50" r="6" fill="${d.color}" opacity="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/></circle>
            <text x="100" y="30" text-anchor="middle" fill="${d.color}" font-size="9" font-weight="700">${d.n.toUpperCase()}</text>
          </svg>
        </div>
        <div class="sec-h">Pengertian</div>
        <p style="font-size:13px;color:var(--text-soft)">${d.desc}.</p>
        <div class="sec-h">Kemungkinan Penyebab</div>
        <p style="font-size:13px;color:var(--text-soft)">${d.cause}.</p>
        <div class="sec-h">Pencegahan / Koreksi</div>
        <p style="font-size:13px;color:var(--text-soft)">${d.prevention}.</p>`;
      if(window.lucide)lucide.createIcons();
    };
    document.querySelectorAll('[data-defect]').forEach(el=>{
      el.onclick=()=>{
        document.querySelectorAll('[data-defect]').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        show(parseInt(el.dataset.defect));
      };
    });
    show(0);document.querySelector('[data-defect]').classList.add('active');
  }else if(this.state.sub===2){
    // defect identification quiz
    const q=[
      {def:0,prompt:'Rongga gas kecil terperangkap dalam bead — cacat?'},
      {def:1,prompt:'Alur cekungan di tepi bead pada logam induk — cacat?'},
      {def:9,prompt:'Logam las menumpang di atas permukaan tanpa ikatan — cacat?'},
      {def:11,prompt:'Terak terperangkap dalam logam las — cacat?'},
      {def:10,prompt:'Bekas busur listrik di luar area pengelasan — cacat?'},
    ];
    let qi=0;
    const render=()=>{
      const qn=q[qi%q.length];
      const d=App.defects[qn.def];
      document.getElementById('qd-prompt').textContent=qn.prompt;
      const opts=[...App.defects].map((x,i)=>({i:i,x:x}));
      // shuffle & take 4 including correct
      const correct=qn.def;
      const others=opts.filter(o=>o.i!==correct).sort(()=>Math.random()-0.5).slice(0,3);
      const choices=[{i:correct,...d},...others.map(o=>({i:o.i,...o.x}))].sort(()=>Math.random()-0.5);
      const fb=document.getElementById('qd-feedback');
      fb.innerHTML='';
      document.getElementById('qd-options').innerHTML=choices.map(c=>`
        <div class="quiz-option" data-opt="${c.i}"><span class="opt-key">${String.fromCharCode(65+choices.indexOf(c))}</span> ${c.n}</div>
      `).join('');
      document.querySelectorAll('[data-opt]').forEach(el=>{
        el.onclick=()=>{
          document.querySelectorAll('[data-opt]').forEach(x=>x.classList.add('disabled'));
          const sel=parseInt(el.dataset.opt);
          if(sel===correct){
            el.classList.add('correct');
            fb.innerHTML=`<div class="note-safety" style="background:rgba(16,185,129,0.08);border-color:#10B981;color:#6ee7b7"><i data-lucide="check-circle"></i><div><strong>Benar!</strong> ${d.n}. ${d.desc}.</div></div>`;
          }else{
            el.classList.add('wrong');
            const correctEl=document.querySelector(`[data-opt="${correct}"]`);
            if(correctEl)correctEl.classList.add('correct');
            fb.innerHTML=`<div class="note-safety"><i data-lucide="x-circle"></i><div><strong>Belum tepat.</strong> Jawaban: <strong>${d.n}</strong>. ${d.desc}.</div></div>`;
          }
          if(window.lucide)lucide.createIcons();
        };
      });
    };
    document.getElementById('qd-next').onclick=()=>{qi++;render();};
    render();
  }
};
