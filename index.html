App.binders.mesin=function(){
  if(this.state.sub===1){
    const proc=document.getElementById('machineProc');
    const show=(i)=>{
      const m=App.machines[i];
      proc.innerHTML=`
        <h3><i data-lucide="cpu"></i> ${m.n}</h3>
        <div class="sec-h">Spesifikasi</div>
        <p style="font-size:12.5px;color:var(--text-soft)">${m.specs}</p>
        <div class="sec-h">Urutan Pengoperasian</div>
        <ol style="counter-reset:step;list-style:none;padding:0">
          ${m.steps.map((st,j)=>`<li style="counter-increment:step;font-size:12.5px;color:var(--text-soft);padding:6px 0 6px 28px;position:relative;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--electric),var(--cyan));color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700">${j+1}</span>${st}</li>`).join('')}
        </ol>
        <div class="note-safety"><i data-lucide="alert-octagon"></i><div><strong>PERHATIAN:</strong> Jangan meninggalkan mesin dalam kondisi ON. Pemilihan arus wajib sesuai ketebalan material, sambungan, kampuh, & posisi pengelasan.</div></div>`;
      if(window.lucide)lucide.createIcons();
    };
    document.querySelectorAll('[data-mop]').forEach(el=>{
      el.onclick=()=>{
        document.querySelectorAll('[data-mop]').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        show(parseInt(el.dataset.mop));
      };
    });
    show(0);document.querySelector('[data-mop]').classList.add('active');
  }else if(this.state.sub===2){
    // panel control sim
    const st={power:false,current:160,hot:5,mode:'DC MMA'};
    const display=document.getElementById('ps-display');
    const update=()=>{
      document.getElementById('ps-switch').textContent=st.power?'ON':'OFF';
      document.getElementById('ps-current').textContent=st.current+'A';
      document.getElementById('ps-hot').textContent=st.hot;
      display.textContent=st.power?String(st.current).padStart(3,'0'):'000';
      display.style.color=st.power?'#10B981':'#475569';
    };
    document.querySelectorAll('[data-ps]').forEach(b=>{
      b.onclick=()=>{
        const a=b.dataset.ps;
        if(a==='power')st.power=!st.power;
        else if(a==='current-up')st.current=Math.min(320,st.current+10);
        else if(a==='current-dn')st.current=Math.max(10,st.current-10);
        else if(a==='hot-up')st.hot=Math.min(10,st.hot+1);
        else if(a==='hot-dn')st.hot=Math.max(0,st.hot-1);
        update();
      };
    });
    document.querySelectorAll('[data-mode]').forEach(b=>{
      b.onclick=()=>{st.mode=b.dataset.mode;App.toast('Mode: '+st.mode);};
    });
    update();
  }
};

App.binders.video=function(){
  const grid=document.getElementById('videoGrid');
  const player=document.getElementById('videoInlinePlayer');
  const mount=document.getElementById('videoEmbedMount');
  const errorPanel=document.getElementById('videoPlayerError');
  const errorTitle=document.getElementById('videoPlayerErrorTitle');
  const errorBody=document.getElementById('videoPlayerErrorBody');
  const externalLink=document.getElementById('videoPlayerFallback');
  const inlineLink=document.getElementById('videoPlayerExternalInline');
  const scroller=document.getElementById('videoContentScroll');
  const titleEl=document.getElementById('videoPlayerTitle');
  const categoryEl=document.getElementById('videoPlayerCategory');
  const hint=document.getElementById('videoPlayerHint');
  const retryBtn=document.getElementById('videoRetryBtn');
  const modeBtn=document.getElementById('videoModeBtn');
  let cat='SMAW',selectedId='',alternateMode=false,generation=0;
  const buildEmbedUrl=id=>{
    const domain=alternateMode?'https://www.youtube-nocookie.com/embed/':'https://www.youtube.com/embed/';
    const params=new URLSearchParams({playsinline:'1',rel:'0'});
    if(location.protocol==='https:' || location.protocol==='http:')params.set('origin',location.origin);
    return domain+encodeURIComponent(id)+'?'+params.toString();
  };
  const release=()=>{
    // Perhatikan konten milik menu lain: hanya hapus elemen di area video.
    mount.replaceChildren();
  };
  const showError=(code)=>{
    if(!selectedId || !mount.isConnected)return;
    errorPanel.hidden=false;
    externalLink.href='https://www.youtube.com/watch?v='+encodeURIComponent(selectedId);
    inlineLink.href=externalLink.href;
    inlineLink.hidden=false;
    if(code===153){
      errorTitle.textContent='YouTube Error 153 — Identitas situs tidak diterima';
      errorBody.textContent='YouTube tidak menerima HTTP Referer dari browser / halaman ini. Coba Mode Lain atau izinkan referer dan cookie YouTube pada browser. Jika tetap ditolak, gunakan tombol Tonton di YouTube; pemutaran di halaman tidak dapat dipaksakan.';
    }else if(code===101 || code===150){
      errorTitle.textContent='Video tidak mengizinkan penyematan';
      errorBody.textContent='Pemilik video membatasi pemutaran di situs lain. Silakan buka video di YouTube atau gunakan video lain yang mengizinkan embed.';
    }else if(code===100){
      errorTitle.textContent='Video tidak ditemukan atau bersifat privat';
      errorBody.textContent='Periksa apakah video masih tersedia. Anda dapat mencoba membukanya langsung di YouTube.';
    }else{
      errorTitle.textContent='Video tidak dapat diputar (kode '+code+')';
      errorBody.textContent='Periksa koneksi, pengaturan privasi browser, dan ketersediaan video. Coba Muat Ulang atau Coba Mode Lain.';
    }
    hint.textContent='Kesalahan YouTube '+code+'. Coba mode alternatif; jika tetap gagal, gunakan tautan cadangan.';
  };
  // Satu iframe untuk satu video; jangan tunggu API tambahan atau menimpa iframe.
  const loadPlayer=()=>{
    if(!selectedId)return;
    const token=++generation;
    release();
    errorPanel.hidden=true;
    hint.textContent=location.protocol==='file:'
      ? 'Buka website melalui alamat GitHub Pages (HTTPS), bukan file lokal, supaya referer YouTube dikirim.'
      : 'Memuat video di website… Jika YouTube menampilkan Error 153, tekan Coba Mode Lain. Jika kedua mode ditolak, pilih Lihat video langsung.';
    const frame=document.createElement('iframe');
    frame.id='videoEmbedFrame';
    frame.title=titleEl.textContent+' — video pembelajaran';
    frame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
    frame.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    frame.setAttribute('allowfullscreen','');
    frame.setAttribute('loading','eager');
    frame.addEventListener('load',()=>{
      // load hanya berarti dokumen iframe sudah dimuat, BUKAN video pasti dapat diputar.
      if(token===generation && mount.isConnected)
        hint.textContent='Jika video masih menampilkan Error 153: klik Coba Mode Lain. YouTube dapat menolak video tertentu meski iframe sudah dimuat.';
    },{once:true});
    frame.addEventListener('error',()=>{
      if(token===generation && mount.isConnected)showError('jaringan');
    },{once:true});
    frame.src=buildEmbedUrl(selectedId);
    mount.appendChild(frame);
  };
  const stopVideo=()=>{
    generation++;
    release();
    player.classList.remove('active');
    errorPanel.hidden=true;
    selectedId='';
    inlineLink.hidden=true;
    alternateMode=false;
    grid.querySelectorAll('.video-card').forEach(card=>card.classList.remove('active'));
  };
  const playVideo=(id,title)=>{
    if(!/^[a-zA-Z0-9_-]{11}$/.test(id)){
      hint.textContent='ID video tidak valid. Silakan periksa data video.';
      return;
    }
    selectedId=id;
    inlineLink.href='https://www.youtube.com/watch?v='+encodeURIComponent(id);
    inlineLink.hidden=false;
    alternateMode=false;
    titleEl.textContent=title;
    categoryEl.textContent=cat+' · VIDEO PEMBELAJARAN';
    player.classList.add('active');
    grid.querySelectorAll('.video-card').forEach(card=>card.classList.toggle('active',card.dataset.video===id));
    loadPlayer();
    if(scroller)scroller.scrollTo({top:0,behavior:'smooth'});
  };
  retryBtn.onclick=()=>loadPlayer();
  modeBtn.onclick=()=>{if(!selectedId)return;alternateMode=!alternateMode;loadPlayer()};
  const render=()=>{
    const vids=App.videos[cat];
    grid.innerHTML=vids.map(v=>`
      <button type="button" class="video-card" data-video="${v.id}" data-title="${v.title}" aria-label="Putar ${v.title} di halaman ini">
        <div class="video-thumb">
          <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="Thumbnail ${v.title}" loading="lazy" onerror="this.style.display='none'">
          <div class="play-overlay"><div class="play-icon"><i data-lucide="play" style="width:22px;height:22px"></i></div></div>
        </div>
        <div class="video-info"><div class="v-cat">${cat}</div><div class="v-title">${v.title}</div></div>
      </button>
    `).join('');
    if(window.lucide)lucide.createIcons();
    grid.querySelectorAll('[data-video]').forEach(card=>{card.onclick=()=>playVideo(card.dataset.video,card.dataset.title)});
  };
  document.getElementById('videoStopBtn').onclick=stopVideo;
  document.querySelectorAll('[data-vcat]').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('[data-vcat]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      cat=b.dataset.vcat;
      stopVideo();
      render();
    };
  });
  render();
};

      <button class="tool-btn primary" id="quizNext" disabled style="opacity:0.4">${App.state.quiz.idx===App.quizQuestions.length-1?'Lihat Hasil':'Berikutnya'} <i data-lucide="arrow-right"></i></button>
    </div>`;
    if(window.lucide)lucide.createIcons();
    document.querySelectorAll('[data-opt]').forEach(el=>{
      el.onclick=()=>{
        if(App.state.quiz.answered)return;
        App.state.quiz.answered=true;
        const sel=parseInt(el.dataset.opt);
        const correct=q.a;
        document.querySelectorAll('[data-opt]').forEach((o,i)=>{
          o.classList.add('disabled');
          if(i===correct)o.classList.add('correct');
          else if(i===sel)o.classList.add('wrong');
        });
        if(sel===correct)App.state.quiz.score++;
        document.getElementById('quizExp').innerHTML=`
          <div class="${sel===correct?'note-safety':'note-add'}" style="${sel===correct?'background:rgba(16,185,129,0.08);border-color:#10B981;color:#6ee7b7':''}">
            <i data-lucide="${sel===correct?'check-circle':'info'}"></i>
            <div><strong>${sel===correct?'Benar!':'Belum tepat.'}</strong> ${q.exp}</div>
          </div>`;
        const nb=document.getElementById('quizNext');
        nb.disabled=false;nb.style.opacity=1;
        if(window.lucide)lucide.createIcons();
      };
    });
    document.getElementById('quizNext').onclick=()=>{
      if(App.state.quiz.idx===App.quizQuestions.length-1){
        App.state.quiz.finished=true;
        const best=parseInt(localStorage.getItem('wls-quiz-best')||'0');
        if(App.state.quiz.score>best)localStorage.setItem('wls-quiz-best',App.state.quiz.score);
        renderResult();
      }else{
        App.state.quiz.idx++;App.state.quiz.answered=false;
        renderQuestion();
      }
    };
    document.getElementById('quizRestart').onclick=()=>{
      App.state.quiz.order=[];App.state.quiz.idx=0;App.state.quiz.score=0;App.state.quiz.answered=false;App.state.quiz.finished=false;
      renderStart();
    };
  };
  const renderResult=()=>{
    const score=App.state.quiz.score,total=App.quizQuestions.length;
    const pct=Math.round((score/total)*100);
    const grade=pct>=80?'Excellent':pct>=60?'Good':pct>=40?'Needs Improvement':'Keep Practicing';
    const color=pct>=80?'#10B981':pct>=60?'#22D3EE':pct>=40?'#F59E0B':'#EF4444';
    body.innerHTML=`
    <div class="center" style="flex:1;text-align:center">
      <div style="max-width:480px">
        <div style="width:120px;height:120px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(${color} ${pct*3.6}deg, rgba(255,255,255,0.05) 0deg);position:relative">
          <div style="width:90px;height:90px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center">
            <div><div class="mono" style="font-size:24px;font-weight:700;color:${color}">${pct}%</div><div class="text-xs text-dim">${score}/${total}</div></div>
          </div>
        </div>
        <h2 style="color:${color};margin-bottom:6px">${grade}</h2>
        <p class="text-dim" style="margin-bottom:18px">Anda menjawab <strong style="color:var(--neon)">${score} dari ${total}</strong> soal dengan benar.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn-primary" id="quizAgain"><i data-lucide="refresh-cw"></i> Ulangi Latihan</button>
          <button class="btn-ghost" data-goto="cacat"><i data-lucide="book-open"></i> Pelajari Cacat Lagi</button>
        </div>
      </div>
    </div>`;
    if(window.lucide)lucide.createIcons();
    document.getElementById('quizAgain').onclick=()=>{
      App.state.quiz.order=[];renderStart();
    };
    document.querySelector('[data-goto]').onclick=()=>App.navigate('cacat');
  };
  if(App.state.quiz.finished)renderResult();
  else if(App.state.quiz.idx>0&&!App.state.quiz.finished)renderQuestion();
  else renderStart();
};

App.openWeld3D=function(){
  const overlay=document.getElementById('modalBackdrop');
  // Release the preview WebGL context before creating the full simulator.
  const small=document.getElementById('homeWeld3D');
  if(small)small.removeAttribute('srcdoc');
  overlay.classList.add('weld-sim-open');
  this.openModal('<i data-lucide="box"></i> Simulasi Pengelasan 3D',
    '<iframe id="weld3DExpanded" title="Simulasi pengelasan 3D interaktif lengkap" allow="fullscreen" allowfullscreen></iframe>');
  document.getElementById('weld3DExpanded').srcdoc=this.weld3DHtml(false);
};
const _weldOriginalCloseModal=App.closeModal;
App.closeModal=function(){
  const overlay=document.getElementById('modalBackdrop');
  if(overlay.classList.contains('weld-sim-open')){
    const frame=document.getElementById('weld3DExpanded');
    if(frame)frame.remove(); // stop animation loop and release Three.js context
    overlay.classList.remove('weld-sim-open');
    const small=document.getElementById('homeWeld3D');
    if(small)small.srcdoc=this.weld3DHtml(true);
  }
  return _weldOriginalCloseModal.call(this);
};
